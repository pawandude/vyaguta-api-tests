name: API Tests

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Run Newman tests
        run: |
          newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export reports/junit-report.xml \
            --reporter-htmlextra-export reports/report.html \
            --reporter-htmlextra-title "Vyaguta API Test Report"
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/

      - name: Summarise failure
        if: failure()
        run: |
          echo "### API Tests failed :x:" >> $GITHUB_STEP_SUMMARY
          echo "View the uploaded **newman-report** artifact for details." >> $GITHUB_STEP_SUMMARY
