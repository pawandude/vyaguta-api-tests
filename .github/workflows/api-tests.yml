name: API Tests

on:
  workflow_dispatch: {}     # manual trigger from Actions tab

permissions:
  contents: write           # needed to push reports to gh-pages branch

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Set dynamic date variables
        run: |
          echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "CURRENT_MONTH=$(date +%m)" >> $GITHUB_ENV
          echo "FUTURE_30=$(date -d '+30 days' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "FUTURE_180=$(date -d '+180 days' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "FUTURE_365=$(date -d '+365 days' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "LEAVE_DATE=$(date -d 'next tuesday' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TOMORROW_ISO=$(date -d '+1 day' +%Y-%m-%dT00:00:00.000Z)" >> $GITHUB_ENV
          echo "DAY_AFTER_ISO=$(date -d '+2 days' +%Y-%m-%dT00:00:00.000Z)" >> $GITHUB_ENV
          echo "LAST_MONTH_START=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Run Newman tests (API collection)
        id: newman-api
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --env-var "today=$TODAY" \
            --env-var "currentYear=$CURRENT_YEAR" \
            --env-var "currentMonth=$CURRENT_MONTH" \
            --env-var "futureDate30=$FUTURE_30" \
            --env-var "futureDate180=$FUTURE_180" \
            --env-var "futureDate365=$FUTURE_365" \
            --env-var "leaveStartDate=$LEAVE_DATE" \
            --env-var "leaveEndDate=$LEAVE_DATE" \
            --env-var "tomorrowISO=$TOMORROW_ISO" \
            --env-var "dayAfterTomorrowISO=$DAY_AFTER_ISO" \
            --env-var "currentDate=$TODAY" \
            --env-var "futureDateLong=$FUTURE_365" \
            --env-var "futureDate=$FUTURE_30" \
            --env-var "lastMonthStart=$LAST_MONTH_START" \
            --reporters cli,junit,htmlextra,json \
            --reporter-junit-export reports/junit-report.xml \
            --reporter-htmlextra-export reports/report.html \
            --reporter-htmlextra-title "Vyaguta API Test Report" \
            --reporter-htmlextra-skipSensitiveData \
            --reporter-json-export reports/results-api.json
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Run Newman tests (Security collection)
        id: newman-security
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-security-tests.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export reports/report-security.html \
            --reporter-htmlextra-title "Vyaguta Security Test Report" \
            --reporter-htmlextra-skipSensitiveData \
            --reporter-json-export reports/results-security.json
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Deploy DEV reports to GitHub Pages
        if: always()
        run: |
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          PAGES_DIR=$(mktemp -d)

          git clone --depth 1 --branch gh-pages "$REPO_URL" "$PAGES_DIR" 2>/dev/null || (
            git init "$PAGES_DIR"
            cd "$PAGES_DIR"
            git checkout --orphan gh-pages
            git remote add origin "$REPO_URL"
          )

          # Stable "latest" path — always overwritten so the email URL never goes stale
          mkdir -p "$PAGES_DIR/latest-dev"
          cp reports/report.html          "$PAGES_DIR/latest-dev/report.html"
          cp reports/report-security.html "$PAGES_DIR/latest-dev/report-security.html"

          cd "$PAGES_DIR"
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"
          git add latest-dev
          git commit -m "Report: run ${{ github.run_id }} — DEV" || true

          for i in 1 2 3; do
            git push origin gh-pages && break || (git pull --rebase origin gh-pages && sleep 3)
          done

      - name: Parse test results
        id: results
        if: always()
        run: node scripts/generate-email-report.js --dir reports --title "Vyaguta API Tests — DEV"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest-dev/report.html
          SECURITY_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest-dev/report-security.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pawanlamichhane@lftechnology.com
          from: Vyaguta API Tests <${{ secrets.MAIL_USERNAME }}>
          html_body: file://reports/email.html

      - name: Fail the job if Newman had failures
        if: steps.newman-api.outcome == 'failure' || steps.newman-security.outcome == 'failure'
        run: exit 1

  newman-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Set dynamic date variables
        run: |
          echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "CURRENT_MONTH=$(date +%m)" >> $GITHUB_ENV
          echo "FUTURE_30=$(date -d '+30 days' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "FUTURE_180=$(date -d '+180 days' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "FUTURE_365=$(date -d '+365 days' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "LEAVE_DATE=$(date -d 'next tuesday' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TOMORROW_ISO=$(date -d '+1 day' +%Y-%m-%dT00:00:00.000Z)" >> $GITHUB_ENV
          echo "DAY_AFTER_ISO=$(date -d '+2 days' +%Y-%m-%dT00:00:00.000Z)" >> $GITHUB_ENV
          echo "LAST_MONTH_START=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Run Newman tests — QA API collection
        id: newman-qa-api
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta-qa.postman_environment.json \
            --env-var "authToken=$VYAGUTA_QA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_QA_RESTRICTED_TOKEN" \
            --env-var "today=$TODAY" \
            --env-var "currentYear=$CURRENT_YEAR" \
            --env-var "currentMonth=$CURRENT_MONTH" \
            --env-var "futureDate30=$FUTURE_30" \
            --env-var "futureDate180=$FUTURE_180" \
            --env-var "futureDate365=$FUTURE_365" \
            --env-var "leaveStartDate=$LEAVE_DATE" \
            --env-var "leaveEndDate=$LEAVE_DATE" \
            --env-var "tomorrowISO=$TOMORROW_ISO" \
            --env-var "dayAfterTomorrowISO=$DAY_AFTER_ISO" \
            --env-var "currentDate=$TODAY" \
            --env-var "futureDateLong=$FUTURE_365" \
            --env-var "futureDate=$FUTURE_30" \
            --env-var "lastMonthStart=$LAST_MONTH_START" \
            --reporters cli,junit,htmlextra,json \
            --reporter-junit-export reports-qa/junit-report.xml \
            --reporter-htmlextra-export reports-qa/report.html \
            --reporter-htmlextra-title "Vyaguta API Test Report — QA" \
            --reporter-htmlextra-skipSensitiveData \
            --reporter-json-export reports-qa/results-api.json
        env:
          VYAGUTA_QA_TOKEN: ${{ secrets.VYAGUTA_QA_TOKEN }}
          VYAGUTA_QA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_QA_RESTRICTED_TOKEN }}

      - name: Run Newman tests — QA Security collection
        id: newman-qa-security
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-security-tests.postman_collection.json \
            -e environments/vyaguta-qa.postman_environment.json \
            --env-var "authToken=$VYAGUTA_QA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_QA_RESTRICTED_TOKEN" \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export reports-qa/report-security.html \
            --reporter-htmlextra-title "Vyaguta Security Test Report — QA" \
            --reporter-htmlextra-skipSensitiveData \
            --reporter-json-export reports-qa/results-security.json
        env:
          VYAGUTA_QA_TOKEN: ${{ secrets.VYAGUTA_QA_TOKEN }}
          VYAGUTA_QA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_QA_RESTRICTED_TOKEN }}

      - name: Run Newman tests — QA Assets collection
        id: newman-qa-assets
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-assets.postman_collection.json \
            -e environments/vyaguta-qa.postman_environment.json \
            --env-var "secopApiKey=$SECOPS_API_KEY" \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export reports-qa/report-assets.html \
            --reporter-htmlextra-title "Vyaguta Assets Test Report — QA" \
            --reporter-htmlextra-skipSensitiveData \
            --reporter-json-export reports-qa/results-assets.json
        env:
          SECOPS_API_KEY: ${{ secrets.SECOPS_API_KEY }}

      - name: Deploy QA reports to GitHub Pages
        if: always()
        run: |
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          PAGES_DIR=$(mktemp -d)

          git clone --depth 1 --branch gh-pages "$REPO_URL" "$PAGES_DIR" 2>/dev/null || (
            git init "$PAGES_DIR"
            cd "$PAGES_DIR"
            git checkout --orphan gh-pages
            git remote add origin "$REPO_URL"
          )

          # Stable "latest" path — always overwritten so the email URL never goes stale
          mkdir -p "$PAGES_DIR/latest-qa"
          cp reports-qa/report.html          "$PAGES_DIR/latest-qa/report.html"
          cp reports-qa/report-security.html "$PAGES_DIR/latest-qa/report-security.html"

          cd "$PAGES_DIR"
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"
          git add latest-qa
          git commit -m "Report: run ${{ github.run_id }} — QA" || true

          for i in 1 2 3; do
            git push origin gh-pages && break || (git pull --rebase origin gh-pages && sleep 3)
          done

      - name: Parse QA test results
        id: qa-results
        if: always()
        run: node scripts/generate-email-report.js --dir reports-qa --title "Vyaguta API Tests — QA" --env-prefix QA
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest-qa/report.html
          SECURITY_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest-qa/report-security.html

      - name: Upload QA test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-qa
          path: reports-qa/

      - name: Send QA email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.QA_SUBJECT }}
          to: pawanlamichhane@lftechnology.com
          from: Vyaguta API Tests <${{ secrets.MAIL_USERNAME }}>
          html_body: file://reports-qa/email.html

      - name: Fail the QA job if Newman had failures
        if: steps.newman-qa-api.outcome == 'failure' || steps.newman-qa-security.outcome == 'failure'
        run: exit 1
