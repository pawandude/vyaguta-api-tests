name: API Tests

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write # required by peaceiris/actions-gh-pages to push the gh-pages branch
  # TODO (security): split into two jobs — test job (contents:read) + deploy job (contents:write)

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Run Newman tests (API collection)
        id: newman-api
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --reporters cli,junit,htmlextra,json \
            --reporter-junit-export reports/junit-report.xml \
            --reporter-htmlextra-export reports/report.html \
            --reporter-htmlextra-title "Vyaguta API Test Report" \
            --reporter-json-export reports/results-api.json
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Run Newman tests (Security collection)
        id: newman-security
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-security-tests.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export reports/report-security.html \
            --reporter-htmlextra-title "Vyaguta Security Test Report" \
            --reporter-json-export reports/results-security.json
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Parse test results
        id: results
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const rApi = require('./reports/results-api.json');
          const rSec = require('./reports/results-security.json');

          const requests   = rApi.run.stats.requests.total  + rSec.run.stats.requests.total;
          const assertions = rApi.run.stats.assertions.total + rSec.run.stats.assertions.total;
          const failed     = rApi.run.stats.assertions.failed + rSec.run.stats.assertions.failed;
          const passed     = assertions - failed;
          const apiDur     = rApi.run.timings.completed - rApi.run.timings.started;
          const secDur     = rSec.run.timings.completed - rSec.run.timings.started;
          const duration   = Math.round((apiDur + secDur) / 1000);
          const allFailures = [...(rApi.run.failures || []), ...(rSec.run.failures || [])];

          // Build execution lookup (id → execution) from both collections
          const execMap = {};
          for (const ex of [...(rApi.run.executions || []), ...(rSec.run.executions || [])]) {
            if (ex.item && ex.item.id) execMap[ex.item.id] = ex;
          }

          const status  = failed === 0 ? 'PASSED' : 'FAILED';
          const emoji   = failed === 0 ? '✅' : '❌';
          const dash    = '—';
          const subject = failed === 0
            ? emoji + ' API Tests Passed ' + dash + ' ' + assertions + ' assertions, 0 failures | Vyaguta DEV'
            : emoji + ' API Tests Failed ' + dash + ' ' + failed + ' failure(s) in ' + assertions + ' assertions | Vyaguta DEV';

          const envFile = process.env.GITHUB_ENV;
          const plain = [
            'STATUS=' + status,
            'REQUESTS=' + requests,
            'ASSERTIONS=' + assertions,
            'PASSED=' + passed,
            'FAILED=' + failed,
            'DURATION=' + duration + 's',
          ].join('\n') + '\n';
          const subjectBlock = 'SUBJECT<<_SUBEOF\n' + subject + '\n_SUBEOF\n';
          fs.appendFileSync(envFile, plain + subjectBlock);
          process.stdout.write(plain + subjectBlock);

          // Generate a self-contained HTML email body
          const color   = failed === 0 ? '#16a34a' : '#dc2626';
          const bgColor = failed === 0 ? '#f0fdf4' : '#fef2f2';
          const reportUrl    = process.env.PAGES_URL || '';
          const secReportUrl = process.env.SECURITY_PAGES_URL || '';
          const runUrl       = process.env.RUN_URL || '';

          const statsData = [
            ['Requests',   requests],
            ['Assertions', assertions],
            ['Passed',     passed],
            ['Failed',     failed],
            ['Duration',   duration + 's'],
          ];
          const rows = statsData.map(([k, v]) => {
            const isFailed = k === 'Failed' && v > 0;
            const valColor = isFailed ? '#dc2626' : '#111827';
            return '<tr>' +
              '<td style=\"padding:10px 20px;color:#6b7280;font-size:14px;border-bottom:1px solid #f3f4f6\">' + k + '</td>' +
              '<td style=\"padding:10px 20px;font-weight:700;font-size:14px;color:' + valColor + ';border-bottom:1px solid #f3f4f6\">' + v + '</td>' +
              '</tr>';
          }).join('');

          // Helpers
          function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
          }
          function methodColor(m) {
            return {GET:'#0ea5e9',POST:'#16a34a',PUT:'#d97706',PATCH:'#7c3aed',DELETE:'#dc2626'}[m] || '#6b7280';
          }
          function prettyJson(str) {
            try { return JSON.stringify(JSON.parse(str), null, 2); } catch(e) { return str; }
          }
          function truncate(str, n) {
            return str.length > n ? str.slice(0, n) + '\n… (truncated)' : str;
          }

          // Build failed-tests detail block (only when there are failures)
          let failureBlock = '';
          if (failed > 0 && allFailures.length > 0) {
            const seen = new Set();
            const failureItems = allFailures.map(function(f) {
              const folder   = (f.parent && f.parent.name) ? f.parent.name : '';
              const reqName  = (f.source && f.source.name) ? f.source.name : 'Unknown request';
              const errMsg   = (f.error && f.error.message) ? f.error.message : 'Assertion failed';
              const testName = (f.error && f.error.test) ? f.error.test : '';
              const location = folder ? folder + ' &rsaquo; ' + reqName : reqName;

              // Look up execution for this request
              const srcId = f.source && f.source.id;
              const ex    = srcId ? execMap[srcId] : null;
              const req   = ex && ex.item && ex.item.request;
              const res   = ex && ex.response;

              // Endpoint
              const method  = req && req.method ? req.method.toUpperCase() : '';
              const rawUrl  = req && req.url ? (typeof req.url === 'string' ? req.url : (req.url.raw || '')) : '';

              // Request headers (filter auth)
              const reqHdrs = (req && Array.isArray(req.header) ? req.header : [])
                .filter(function(h) { return h && h.key && !/^authorization$/i.test(h.key); })
                .map(function(h) { return escHtml(h.key) + ': ' + escHtml(h.value || ''); })
                .join('\n');

              // Request body
              const reqBodyRaw = req && req.body && req.body.raw ? req.body.raw : '';
              const reqBody    = reqBodyRaw ? truncate(prettyJson(reqBodyRaw), 600) : '';

              // Response
              const statusCode = res && res.code != null ? res.code : '';
              const statusText = res && res.status ? res.status : '';
              const resHdrs    = (res && Array.isArray(res.header) ? res.header
                : (res && res.headers && Array.isArray(res.headers.members) ? res.headers.members : []))
                .filter(function(h) { return h && h.key; })
                .map(function(h) { return escHtml(h.key) + ': ' + escHtml(h.value || ''); })
                .join('\n');
              let resBody = '';
              if (res && res.stream) {
                try {
                  const bytes = res.stream.data ? Buffer.from(res.stream.data) : Buffer.from(res.stream);
                  resBody = truncate(prettyJson(bytes.toString('utf8')), 800);
                } catch(e) {}
              }

              // Dedup: show endpoint block only once per unique request
              const dedupKey = srcId || location;
              const isFirstForRequest = !seen.has(dedupKey);
              seen.add(dedupKey);

              const endpointBlock = isFirstForRequest && method ? (
                '<div style=\"margin-bottom:8px;display:flex;align-items:center;gap:8px\">' +
                '<span style=\"background:' + methodColor(method) + ';color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;font-family:monospace\">' + escHtml(method) + '</span>' +
                '<span style=\"font-size:11px;color:#374151;font-family:monospace;word-break:break-all\">' + escHtml(rawUrl) + '</span>' +
                '</div>'
              ) : '';

              const reqHdrBlock = isFirstForRequest && reqHdrs ? (
                '<div style=\"margin-bottom:6px\">' +
                '<div style=\"font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.05em;margin-bottom:2px\">REQUEST HEADERS</div>' +
                '<pre style=\"margin:0;font-size:10px;background:#f8fafc;padding:6px 8px;border-radius:3px;overflow-x:auto;white-space:pre-wrap;word-break:break-all\">' + reqHdrs + '</pre>' +
                '</div>'
              ) : '';

              const reqBodyBlock = isFirstForRequest && reqBody ? (
                '<div style=\"margin-bottom:6px\">' +
                '<div style=\"font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.05em;margin-bottom:2px\">REQUEST BODY</div>' +
                '<pre style=\"margin:0;font-size:10px;background:#f8fafc;padding:6px 8px;border-radius:3px;overflow-x:auto;white-space:pre-wrap;word-break:break-all\">' + escHtml(reqBody) + '</pre>' +
                '</div>'
              ) : '';

              const resStatusBlock = isFirstForRequest && statusCode ? (
                '<div style=\"margin-bottom:6px\">' +
                '<div style=\"font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.05em;margin-bottom:2px\">RESPONSE STATUS</div>' +
                '<span style=\"font-size:11px;font-family:monospace;color:' + (statusCode >= 400 ? '#dc2626' : '#16a34a') + ';font-weight:700\">' + escHtml(String(statusCode)) + ' ' + escHtml(statusText) + '</span>' +
                '</div>'
              ) : '';

              const resHdrBlock = isFirstForRequest && resHdrs ? (
                '<div style=\"margin-bottom:6px\">' +
                '<div style=\"font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.05em;margin-bottom:2px\">RESPONSE HEADERS</div>' +
                '<pre style=\"margin:0;font-size:10px;background:#f8fafc;padding:6px 8px;border-radius:3px;overflow-x:auto;white-space:pre-wrap;word-break:break-all\">' + resHdrs + '</pre>' +
                '</div>'
              ) : '';

              const resBodyBlock = isFirstForRequest && resBody ? (
                '<div style=\"margin-bottom:6px\">' +
                '<div style=\"font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.05em;margin-bottom:2px\">RESPONSE BODY</div>' +
                '<pre style=\"margin:0;font-size:10px;background:#f8fafc;padding:6px 8px;border-radius:3px;overflow-x:auto;white-space:pre-wrap;word-break:break-all\">' + escHtml(resBody) + '</pre>' +
                '</div>'
              ) : '';

              return '<div style=\"margin-bottom:16px;padding:14px 16px;background:#fff;border-left:3px solid #dc2626;border-radius:0 4px 4px 0;border:1px solid #fecaca;border-left-width:3px\">' +
                '<div style=\"font-size:12px;font-weight:700;color:#374151;margin-bottom:6px\">' + escHtml(location) + '</div>' +
                endpointBlock +
                reqHdrBlock +
                reqBodyBlock +
                resStatusBlock +
                resHdrBlock +
                resBodyBlock +
                '<div style=\"margin-top:8px;padding-top:8px;border-top:1px solid #fee2e2\">' +
                (testName ? '<div style=\"font-size:10px;color:#6b7280;margin-bottom:3px\">Test: ' + escHtml(testName) + '</div>' : '') +
                '<div style=\"font-size:11px;color:#dc2626;font-family:monospace;font-weight:600\">' + escHtml(errMsg) + '</div>' +
                '</div>' +
                '</div>';
            }).join('');
            failureBlock =
              '<div style=\"padding:20px 24px;background:#fef2f2;border-top:1px solid #fecaca\">' +
              '<div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b91c1c;margin-bottom:14px\">Failed Tests (' + allFailures.length + ')</div>' +
              failureItems +
              '</div>';
          }

          const html = '<!DOCTYPE html><html><body style=\"margin:0;font-family:Arial,sans-serif;background:#f3f4f6\">' +
            '<div style=\"max-width:580px;margin:32px auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)\">' +
            // Header
            '<div style=\"background:' + color + ';padding:26px 32px\">' +
            '<div style=\"font-size:26px;font-weight:700;color:#fff\">' + emoji + ' API Tests ' + status + '</div>' +
            '<div style=\"color:rgba(255,255,255,.8);font-size:13px;margin-top:6px\">Vyaguta DEV &nbsp;·&nbsp; ' + requests + ' requests &nbsp;·&nbsp; ' + duration + 's</div>' +
            '</div>' +
            // Stats table
            '<div style=\"background:' + bgColor + ';padding:0\">' +
            '<table style=\"width:100%;border-collapse:collapse\">' + rows + '</table>' +
            '</div>' +
            // Failure detail (only for failed runs)
            failureBlock +
            // Footer buttons
            '<div style=\"padding:24px 32px\">' +
            '<a href=\"' + reportUrl + '\" style=\"display:inline-block;background:#1d4ed8;color:#fff;text-decoration:none;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600;margin-right:10px\">View API Report</a>' +
            '<a href=\"' + secReportUrl + '\" style=\"display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600;margin-right:10px\">View Security Report</a>' +
            '<a href=\"' + runUrl + '\" style=\"display:inline-block;background:#f3f4f6;color:#374151;text-decoration:none;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600\">GitHub Actions Run</a>' +
            '</div>' +
            '</div></body></html>';

          fs.writeFileSync('reports/email.html', html);
          "
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://pawandude.github.io/vyaguta-api-tests/report.html
          SECURITY_PAGES_URL: https://pawandude.github.io/vyaguta-api-tests/report-security.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          publish_branch: gh-pages
          destination_dir: .
          keep_files: false

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pawanlamichhane@lftechnology.com,rikeshshrestha@lftechnology.com,nischalkhadka@lftechnology.com,swarnamaden@lftechnology.com,palisthashrestha@lftechnology.com,shrijanabudhathoki@lftechnology.com
          from: Vyaguta API Tests <${{ secrets.MAIL_USERNAME }}>
          html_body: file://reports/email.html

      - name: Fail the job if Newman had failures
        if: steps.newman-api.outcome == 'failure' || steps.newman-security.outcome == 'failure'
        run: exit 1
