name: API Tests

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Run Newman tests
        id: newman
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --reporters cli,junit,htmlextra,json \
            --reporter-junit-export reports/junit-report.xml \
            --reporter-htmlextra-export reports/report.html \
            --reporter-htmlextra-title "Vyaguta API Test Report" \
            --reporter-json-export reports/results.json
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Parse test results
        id: results
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const r = require('./reports/results.json');
          const stats = r.run.stats;
          const timings = r.run.timings;

          const requests   = stats.requests.total;
          const assertions = stats.assertions.total;
          const failed     = stats.assertions.failed;
          const passed     = assertions - failed;
          const duration   = Math.round((timings.completed - timings.started) / 1000);

          const status  = failed === 0 ? 'PASSED' : 'FAILED';
          const emoji   = failed === 0 ? '✅' : '❌';
          const dash    = '—';
          const subject = failed === 0
            ? emoji + ' API Tests Passed ' + dash + ' ' + assertions + ' assertions, 0 failures | Vyaguta DEV'
            : emoji + ' API Tests Failed ' + dash + ' ' + failed + ' failure(s) in ' + assertions + ' assertions | Vyaguta DEV';

          const envFile = process.env.GITHUB_ENV;
          // Simple KEY=VALUE for plain vars
          const plain = [
            'STATUS=' + status,
            'REQUESTS=' + requests,
            'ASSERTIONS=' + assertions,
            'PASSED=' + passed,
            'FAILED=' + failed,
            'DURATION=' + duration + 's',
          ].join('\n') + '\n';
          // Use multiline delimiter for SUBJECT (contains emoji/special chars)
          const subjectBlock = 'SUBJECT<<_SUBEOF\n' + subject + '\n_SUBEOF\n';

          fs.appendFileSync(envFile, plain + subjectBlock);
          process.stdout.write(plain + subjectBlock);
          "

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pawanlamichhane@lftechnology.com
          from: Vyaguta API Tests <${{ secrets.MAIL_USERNAME }}>
          body: |
            ${{ env.STATUS }} — Vyaguta API Tests (DEV)
            ─────────────────────────────────────
            Requests   : ${{ env.REQUESTS }}
            Assertions : ${{ env.ASSERTIONS }}
            Passed     : ${{ env.PASSED }}
            Failed     : ${{ env.FAILED }}
            Duration   : ${{ env.DURATION }}
            ─────────────────────────────────────
            View the full HTML report (passed + failed details):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the report:
            Go to the link above → Artifacts → newman-report → report.html
            ─────────────────────────────────────
            Triggered by: ${{ github.event_name }}
            Run #: ${{ github.run_number }}

      - name: Fail the job if Newman had failures
        if: steps.newman.outcome == 'failure'
        run: exit 1
