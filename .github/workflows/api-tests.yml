name: API Tests

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write # required by peaceiris/actions-gh-pages to push the gh-pages branch
  # TODO (security): split into two jobs — test job (contents:read) + deploy job (contents:write)

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Run Newman tests
        id: newman
        continue-on-error: true
        run: |
          npx newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --env-var "restrictedToken=$VYAGUTA_RESTRICTED_TOKEN" \
            --reporters cli,junit,htmlextra,json \
            --reporter-junit-export reports/junit-report.xml \
            --reporter-htmlextra-export reports/report.html \
            --reporter-htmlextra-title "Vyaguta API Test Report" \
            --reporter-json-export reports/results.json
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}
          VYAGUTA_RESTRICTED_TOKEN: ${{ secrets.VYAGUTA_RESTRICTED_TOKEN }}

      - name: Parse test results
        id: results
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const r = require('./reports/results.json');
          const stats = r.run.stats;
          const timings = r.run.timings;

          const requests   = stats.requests.total;
          const assertions = stats.assertions.total;
          const failed     = stats.assertions.failed;
          const passed     = assertions - failed;
          const duration   = Math.round((timings.completed - timings.started) / 1000);

          const status  = failed === 0 ? 'PASSED' : 'FAILED';
          const emoji   = failed === 0 ? '✅' : '❌';
          const dash    = '—';
          const subject = failed === 0
            ? emoji + ' API Tests Passed ' + dash + ' ' + assertions + ' assertions, 0 failures | Vyaguta DEV'
            : emoji + ' API Tests Failed ' + dash + ' ' + failed + ' failure(s) in ' + assertions + ' assertions | Vyaguta DEV';

          const envFile = process.env.GITHUB_ENV;
          const plain = [
            'STATUS=' + status,
            'REQUESTS=' + requests,
            'ASSERTIONS=' + assertions,
            'PASSED=' + passed,
            'FAILED=' + failed,
            'DURATION=' + duration + 's',
          ].join('\n') + '\n';
          const subjectBlock = 'SUBJECT<<_SUBEOF\n' + subject + '\n_SUBEOF\n';
          fs.appendFileSync(envFile, plain + subjectBlock);
          process.stdout.write(plain + subjectBlock);

          // Generate a self-contained HTML email body
          const color   = failed === 0 ? '#16a34a' : '#dc2626';
          const bgColor = failed === 0 ? '#f0fdf4' : '#fef2f2';
          const statRowColor = failed === 0 ? '#15803d' : '#b91c1c';
          const reportUrl = process.env.PAGES_URL || '';
          const runUrl    = process.env.RUN_URL || '';

          const statsData = [
            ['Requests',   requests],
            ['Assertions', assertions],
            ['Passed',     passed],
            ['Failed',     failed],
            ['Duration',   duration + 's'],
          ];
          const rows = statsData.map(([k, v]) => {
            const isFailed = k === 'Failed' && v > 0;
            const valColor = isFailed ? '#dc2626' : '#111827';
            return '<tr>' +
              '<td style=\"padding:10px 20px;color:#6b7280;font-size:14px;border-bottom:1px solid #f3f4f6\">' + k + '</td>' +
              '<td style=\"padding:10px 20px;font-weight:700;font-size:14px;color:' + valColor + ';border-bottom:1px solid #f3f4f6\">' + v + '</td>' +
              '</tr>';
          }).join('');

          // Build failed-tests detail block (only when there are failures)
          let failureBlock = '';
          if (failed > 0 && r.run.failures && r.run.failures.length > 0) {
            const failureItems = r.run.failures.map(function(f) {
              const folder   = (f.parent && f.parent.name) ? f.parent.name : '';
              const reqName  = (f.source && f.source.name) ? f.source.name : 'Unknown request';
              const errMsg   = (f.error && f.error.message) ? f.error.message : 'Assertion failed';
              const testName = (f.error && f.error.test) ? f.error.test : '';
              const location = folder ? folder + ' &rsaquo; ' + reqName : reqName;
              return '<div style=\"margin-bottom:12px;padding:12px 14px;background:#fff;border-left:3px solid #dc2626;border-radius:0 4px 4px 0\">' +
                '<div style=\"font-size:12px;font-weight:700;color:#374151;margin-bottom:4px\">' + location + '</div>' +
                (testName ? '<div style=\"font-size:11px;color:#6b7280;margin-bottom:4px\">Test: ' + testName + '</div>' : '') +
                '<div style=\"font-size:12px;color:#dc2626;font-family:monospace\">' + errMsg + '</div>' +
                '</div>';
            }).join('');
            failureBlock =
              '<div style=\"padding:20px 24px;background:#fef2f2;border-top:1px solid #fecaca\">' +
              '<div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b91c1c;margin-bottom:12px\">Failed Tests (' + r.run.failures.length + ')</div>' +
              failureItems +
              '</div>';
          }

          const html = '<!DOCTYPE html><html><body style=\"margin:0;font-family:Arial,sans-serif;background:#f3f4f6\">' +
            '<div style=\"max-width:580px;margin:32px auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)\">' +
            // Header
            '<div style=\"background:' + color + ';padding:26px 32px\">' +
            '<div style=\"font-size:26px;font-weight:700;color:#fff\">' + emoji + ' API Tests ' + status + '</div>' +
            '<div style=\"color:rgba(255,255,255,.8);font-size:13px;margin-top:6px\">Vyaguta DEV &nbsp;·&nbsp; ' + requests + ' requests &nbsp;·&nbsp; ' + duration + 's</div>' +
            '</div>' +
            // Stats table
            '<div style=\"background:' + bgColor + ';padding:0\">' +
            '<table style=\"width:100%;border-collapse:collapse\">' + rows + '</table>' +
            '</div>' +
            // Failure detail (only for failed runs)
            failureBlock +
            // Footer buttons
            '<div style=\"padding:24px 32px\">' +
            '<a href=\"' + reportUrl + '\" style=\"display:inline-block;background:#1d4ed8;color:#fff;text-decoration:none;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600;margin-right:10px\">View Full Report</a>' +
            '<a href=\"' + runUrl + '\" style=\"display:inline-block;background:#f3f4f6;color:#374151;text-decoration:none;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600\">GitHub Actions Run</a>' +
            '</div>' +
            '</div></body></html>';

          fs.writeFileSync('reports/email.html', html);
          "
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://pawandude.github.io/vyaguta-api-tests/report.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          publish_branch: gh-pages
          destination_dir: .
          keep_files: false

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pawanlamichhane@lftechnology.com,rikeshshrestha@lftechnology.com,nischalkhadka@lftechnology.com,swarnamaden@lftechnology.com,palisthashrestha@lftechnology.com,shrijanabudhathoki@lftechnology.com
          from: Vyaguta API Tests <${{ secrets.MAIL_USERNAME }}>
          html_body: file://reports/email.html

      - name: Fail the job if Newman had failures
        if: steps.newman.outcome == 'failure'
        run: exit 1
