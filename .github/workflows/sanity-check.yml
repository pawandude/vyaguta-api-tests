name: Sanity Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint collection and environment JSON
        run: npm run lint

      - name: Run sanity checks
        run: |
          newman run collections/vyaguta-api.postman_collection.json \
            -e environments/vyaguta.postman_environment.json \
            --env-var "authToken=$VYAGUTA_TOKEN" \
            --folder Sanity \
            --reporters cli,junit \
            --reporter-junit-export reports/sanity-junit-report.xml
        env:
          VYAGUTA_TOKEN: ${{ secrets.VYAGUTA_TOKEN }}

      - name: Upload sanity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-report
          path: reports/sanity-junit-report.xml

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Vyaguta Sanity Check failed*",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>", "short": true }
                  ]
                }
              ]
            }
